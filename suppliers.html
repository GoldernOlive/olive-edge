<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Supplier Compare — Olive Edge</title>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <a href="search.html" class="nav-logo" style="text-decoration:none"><span class="sub">Golden Olive</span><span class="main">Olive <span>Edge</span></span></a>
    <div class="nav-links">
      <a href="search.html" class="nav-link">🔍 Search</a>
      <a href="listing-generator.html" class="nav-link">✍️ Listing Writer</a>
      <a href="listing-auditor.html" class="nav-link">🔎 My Listings</a>
    </div>
    <div class="nav-user">
      <span class="nav-email" id="nav-email"></span>
      <button class="btn-ghost btn-sm" onclick="logout()">Log Out</button>
    </div>
  </div>
</nav>

<div class="page">
  <div class="fu">
    <div class="page-title serif">💰 Supplier Compare</div>
    <div class="page-sub">Printify vs Printful vs Gelato — real base costs, margins and best regions</div>
  </div>
  <div class="card fu" style="display:flex;gap:10px;flex-wrap:wrap">
    <input id="sup-q" placeholder="Search product e.g. ceramic mug, unisex t-shirt, A4 art print, hoodie, tote bag..." style="flex:1" onkeydown="if(event.key==='Enter')doSupplier()"/>
    <button class="btn-olive" onclick="doSupplier()">Compare →</button>
  </div>
  <div id="chip-row" style="margin-bottom:14px"></div>

  <div class="card-gold">
    <div class="lbl" style="color:var(--gd)">⚡ Live Profit Calculator</div>
    <div class="grid-auto" style="margin-bottom:14px">
      <div><div class="lbl">Base Cost (£)</div><input type="number" id="c-base" step="0.01" value="0" oninput="calcProfit()"/></div>
      <div><div class="lbl">UK Sell Price (£)</div><input type="number" id="c-uk" step="0.01" value="0" oninput="calcProfit()"/></div>
      <div><div class="lbl">USA Price ($)</div><input type="number" id="c-us" step="0.01" value="0" oninput="calcProfit()"/></div>
      <div><div class="lbl">EU Price (€)</div><input type="number" id="c-eu" step="0.01" value="0" oninput="calcProfit()"/></div>
      <div><div class="lbl">Etsy Ads (£)</div><input type="number" id="c-ads" step="0.01" value="0" oninput="calcProfit()"/></div>
    </div>
    <div id="calc-out" class="grid-auto"></div>
  </div>

  <div id="sup-res"></div>
</div>

<script>
// Auth
function getSession(){return{token:localStorage.getItem('oe_token')||'',email:localStorage.getItem('oe_email')||'',userId:localStorage.getItem('oe_uid')||''};}
function logout(){localStorage.removeItem('oe_token');localStorage.removeItem('oe_email');localStorage.removeItem('oe_uid');window.location.href='index.html';}
var SESSION=getSession();
if(!SESSION.token){window.location.href='index.html';}
else{var em=document.getElementById('nav-email');if(em)em.textContent=SESSION.email;}



// Build chip buttons
var CHIPS=['ceramic mug 11oz','unisex t-shirt','tote bag canvas','A4 art print','phone case','hoodie','canvas print','greeting card','throw pillow','sticker sheet','water bottle'];
var chipHtml='';
for(var i=0;i<CHIPS.length;i++){
  chipHtml+='<button class="btn-chip" onclick="setChip(\''+CHIPS[i]+'\')">'+CHIPS[i]+'</button>';
}
document.getElementById('chip-row').innerHTML=chipHtml;
function setChip(p){document.getElementById('sup-q').value=p;doSupplier();}

// Helpers
function sbox(l,v,c){return '<div class="sbox"><div class="lbl">'+l+'</div><div class="mono" style="font-size:15px;color:'+(c||'var(--tx)')+';font-weight:600">'+(v||'—')+'</div></div>';}
function errBox(msg){return '<div class="card-red"><strong>Error:</strong> '+msg+'</div>';}
function demandColor(d){return d==='High'?'var(--ol)':d==='Medium'?'var(--gd)':'var(--mu)';}

async function callAI(prompt){
  var r=await fetch('/api/groq',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:prompt})});
  var text=await r.text();
  var d;
  try{d=JSON.parse(text);}catch(e){var s=text.indexOf('{'),en=text.lastIndexOf('}');if(s>=0&&en>s)d=JSON.parse(text.slice(s,en+1));else throw new Error('Bad response: '+text.slice(0,80));}
  if(!r.ok)throw new Error((d&&d.error&&d.error.message)||'Server error '+r.status);
  return d;
}

function calcProfit(){
  var base=parseFloat(document.getElementById('c-base').value)||0;
  var uk=parseFloat(document.getElementById('c-uk').value)||0;
  var ads=parseFloat(document.getElementById('c-ads').value)||0;
  var fee=uk*0.065,listing=0.18,profit=uk-base-fee-listing-ads;
  var mp=uk>0?((profit/uk)*100).toFixed(1):0;
  var pc=profit>5?'var(--ol)':profit>0?'var(--gd)':'var(--rd)';
  var rows=[
    ['UK Sell Price','£'+uk.toFixed(2),'var(--tx)'],
    ['Etsy Fee 6.5%','-£'+fee.toFixed(2),'var(--rd)'],
    ['Listing Fee','-£0.18','var(--rd)'],
    ['Base Cost','-£'+base.toFixed(2),'var(--rd)'],
    ['Etsy Ads',ads>0?'-£'+ads.toFixed(2):'£0','var(--rd)'],
    ['Your Profit','£'+profit.toFixed(2),pc],
    ['Margin',mp+'%',pc]
  ];
  document.getElementById('calc-out').innerHTML=rows.map(function(r){return sbox(r[0],r[1],r[2]);}).join('');
}
calcProfit();

async function doSupplier(){
  var q=document.getElementById('sup-q').value.trim();if(!q)return;
  var res=document.getElementById('sup-res');
  res.innerHTML='<div class="card"><div class="loading-row"><div class="spin"></div>Fetching real costs from Printify, Printful & Gelato...</div></div>';
  try{
    var d=await callAI('What are the real base costs for "'+q+'" on Printify, Printful, and Gelato? What are real Etsy selling prices globally? Return JSON: {"product":"'+q+'","printify":[{"variant":"specific variant","baseCost":"£X","printArea":"size","supplier":"name","shipsTo":"Worldwide|UK+EU|USA","notes":"key info"}],"printful":[{"variant":"specific variant","baseCost":"£X","printArea":"size","shipsTo":"Worldwide|UK+EU","notes":"key info"}],"gelato":[{"variant":"specific variant","baseCost":"£X","printArea":"size","deliveryUK":"X-Y days","notes":"key info"}],"etsyPricing":{"UK":"£X avg","USA":"$X avg","Germany":"€X avg","Australia":"AU$X avg"},"bestSetup":{"platform":"Printify|Printful|Gelato","variant":"exact variant","baseCost":"£X","ukPrice":"£X","usaPrice":"$X","euPrice":"€X","netProfitUK":"£X","marginPct":"X%","breakEven":5,"whyBest":"reason"},"demandByMarket":{"UK":"High|Medium|Low","USA":"High|Medium|Low","Germany":"High|Medium|Low","Australia":"High|Medium|Low"},"comparison":{"printifyPro":"advantage","printifyMinus":"disadvantage","printfulPro":"advantage","printfulMinus":"disadvantage","gelatoPro":"advantage","gelatoMinus":"disadvantage"},"tips":["tip1","tip2","tip3"]}');

    var b=parseFloat((d.bestSetup&&d.bestSetup.baseCost||'').replace('£','')||0);
    var uk=parseFloat((d.bestSetup&&d.bestSetup.ukPrice||'').replace('£','')||0);
    var us=parseFloat((d.bestSetup&&d.bestSetup.usaPrice||'').replace('$','')||0);
    var eu=parseFloat((d.bestSetup&&d.bestSetup.euPrice||'').replace('€','')||0);
    document.getElementById('c-base').value=b;
    document.getElementById('c-uk').value=uk;
    document.getElementById('c-us').value=us;
    document.getElementById('c-eu').value=eu;
    calcProfit();

    var bs=d.bestSetup||{};
    var html='<div class="card-live fu"><div class="lbl" style="color:var(--ol)">⭐ Best Setup — '+bs.platform+'</div>';
    html+='<div style="font-weight:700;font-size:18px;margin-bottom:12px;font-family:Cormorant Garamond,serif">'+d.product+'</div>';
    html+='<div class="grid-auto" style="margin-bottom:14px">'+sbox('Platform',bs.platform,'var(--bl)')+sbox('Base Cost',bs.baseCost,'var(--mu)')+sbox('UK Price',bs.ukPrice,'var(--gd)')+sbox('USA Price',bs.usaPrice,'var(--gd)')+sbox('Net Profit UK',bs.netProfitUK,'var(--ol)')+sbox('Margin',bs.marginPct,'var(--ol)')+sbox('Break Even',(bs.breakEven||'—')+' sales','var(--mu)')+'</div>';
    html+='<p style="font-size:13px;color:var(--mu)">'+(bs.whyBest||'')+'</p></div>';

    html+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px" class="d1">';
    var platforms=[
      ['🖨️ Printify',d.printify,'var(--bl)',d.comparison&&d.comparison.printifyPro,d.comparison&&d.comparison.printifyMinus],
      ['🖨️ Printful',d.printful,'var(--gd)',d.comparison&&d.comparison.printfulPro,d.comparison&&d.comparison.printfulMinus],
      ['🖨️ Gelato',d.gelato,'var(--ol)',d.comparison&&d.comparison.gelatoPro,d.comparison&&d.comparison.gelatoMinus]
    ];
    platforms.forEach(function(row){
      html+='<div class="card"><div class="lbl">'+row[0]+'</div>';
      (row[1]||[]).forEach(function(o){html+='<div style="padding:10px 0;border-bottom:1px solid var(--b1)"><div style="font-weight:600;font-size:13px;margin-bottom:4px">'+o.variant+'</div><div class="mono" style="color:'+row[2]+';font-weight:700;font-size:15px">'+o.baseCost+'</div><div style="font-size:11px;color:var(--mu);margin-top:3px">'+(o.shipsTo||o.deliveryUK||'')+' · '+(o.notes||'')+'</div></div>';});
      html+='<div style="margin-top:10px"><div style="font-size:11px;color:var(--gn);margin-bottom:4px">✓ '+(row[3]||'')+'</div><div style="font-size:11px;color:var(--rd)">✗ '+(row[4]||'')+'</div></div></div>';
    });
    html+='</div>';

    html+='<div class="card d2"><div class="lbl">🌍 Etsy Pricing + Demand by Market</div><div class="grid-auto">';
    var markets=[['UK','🇬🇧',d.etsyPricing&&d.etsyPricing.UK],['USA','🇺🇸',d.etsyPricing&&d.etsyPricing.USA],['Germany','🇩🇪',d.etsyPricing&&d.etsyPricing.Germany],['Australia','🇦🇺',d.etsyPricing&&d.etsyPricing.Australia]];
    markets.forEach(function(m){html+='<div class="sbox"><div class="lbl">'+m[1]+' '+m[0]+'</div><div class="mono" style="color:var(--gd);font-weight:700;font-size:15px">'+(m[2]||'—')+'</div><div style="font-size:11px;color:'+demandColor(d.demandByMarket&&d.demandByMarket[m[0]]||'Medium')+';margin-top:4px">'+(d.demandByMarket&&d.demandByMarket[m[0]]||'—')+' demand</div></div>';});
    html+='</div></div>';

    html+='<div class="card-gold d3"><div class="lbl" style="color:var(--gd)">💡 Pro Tips</div>';
    (d.tips||[]).forEach(function(t){html+='<div style="display:flex;gap:8px;margin-bottom:10px;font-size:13px;line-height:1.6"><span style="color:var(--gd);font-weight:700">→</span><span style="color:var(--mu)">'+t+'</span></div>';});
    html+='</div>';

    res.innerHTML=html;
  }catch(e){res.innerHTML=errBox(e.message);}
}
</script>
</body>
</html>
