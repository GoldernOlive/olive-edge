<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Scanner — Olive Edge</title>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <a href="search.html" class="nav-logo" style="text-decoration:none"><span class="sub">Golden Olive</span><span class="main">Olive <span>Edge</span></span></a>
    <div class="nav-links">
      <a href="search.html" class="nav-link">🔍 Search</a>
      <a href="listing-generator.html" class="nav-link">✍️ Listing Writer</a>
      <a href="listing-auditor.html" class="nav-link">🔎 My Listings</a>
    </div>
    <div class="nav-user">
      <span class="nav-email" id="nav-email"></span>
      <button class="btn-ghost btn-sm" onclick="logout()">Log Out</button>
    </div>
  </div>
</nav>
<div class="page">
  <div class="fu">
    <div class="page-title serif">🔍 Product & Shop Scanner</div>
    <div class="page-sub">Scan any keyword or Etsy shop — get full performance and competitive intelligence</div>
  </div>
  <div class="card fu">
    <div style="display:flex;gap:0;margin-bottom:16px;border:1.5px solid var(--b1);border-radius:8px;overflow:hidden">
      <button id="tb-kw" onclick="switchMode('kw')" style="flex:1;background:var(--ol);color:#fff;border:none;padding:10px;font-family:Jost,sans-serif;font-size:13px;font-weight:600;cursor:pointer">🔍 Keyword Scan</button>
      <button id="tb-shop" onclick="switchMode('shop')" style="flex:1;background:transparent;color:var(--mu);border:none;padding:10px;font-family:Jost,sans-serif;font-size:13px;font-weight:600;cursor:pointer;border-left:1px solid var(--b1)">🏪 Shop Intelligence</button>
    </div>
    <div id="kw-mode">
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <input id="kw-input" placeholder="Enter keyword e.g. custom mug, pet portrait, wall art..." style="flex:1;min-width:200px" onkeydown="if(event.key==='Enter')doKeywordScan()"/>
        <button class="btn-olive" onclick="doKeywordScan()">Scan →</button>
      </div>
    </div>
    <div id="shop-mode" style="display:none">
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <input id="shop-input" placeholder="Enter Etsy shop name e.g. ThePrintablePlace..." style="flex:1;min-width:200px" onkeydown="if(event.key==='Enter')doShopScan()"/>
        <button class="btn-olive" onclick="doShopScan()">Analyse Shop →</button>
      </div>
    </div>
  </div>
  <div id="scan-res"></div>
</div>
<script>
var SB_URL='https://oktpizrevqehfrkcqphq.supabase.co';
var SB_KEY='sb_publishable_r4lLwwInTT76wXjP-Cha4Q_T1yALqyt';
function getSession(){return{token:localStorage.getItem('oe_token')||'',email:localStorage.getItem('oe_email')||'',userId:localStorage.getItem('oe_uid')||''}}
function logout(){localStorage.removeItem('oe_token');localStorage.removeItem('oe_email');localStorage.removeItem('oe_uid');window.location.href='index.html';}
var SESSION=getSession();
if(!SESSION.token){window.location.href='index.html';}
else{var em=document.getElementById('nav-email');if(em)em.textContent=SESSION.email;}
function nowTs(){return new Date().toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function tsBar(label){return '<div style="display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;font-size:11px;color:var(--mu);background:var(--p2);padding:5px 12px;border-radius:20px;border:1px solid var(--b1)"><span style="width:7px;height:7px;border-radius:50%;background:var(--gn);display:inline-block"></span>'+label+' · Live · '+nowTs()+'</div>';}
async function callAI(prompt){var r=await fetch('/api/groq',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:prompt})});var text=await r.text();var d;try{d=JSON.parse(text);}catch(e){var s=text.indexOf('{'),en=text.lastIndexOf('}');if(s>=0&&en>s)d=JSON.parse(text.slice(s,en+1));else throw new Error('Bad AI response');}if(!r.ok)throw new Error((d&&d.error&&d.error.message)||'AI error '+r.status);return d;}
function sbox(l,v,c){return '<div class="sbox"><div class="lbl">'+l+'</div><div class="mono" style="font-size:15px;color:'+(c||'var(--tx)')+';font-weight:700">'+(v||'—')+'</div></div>';}
function pill(t){return '<span class="pill">'+t+'</span>';}
function switchMode(m){
  document.getElementById('kw-mode').style.display=m==='kw'?'block':'none';
  document.getElementById('shop-mode').style.display=m==='shop'?'block':'none';
  document.getElementById('tb-kw').style.background=m==='kw'?'var(--ol)':'transparent';
  document.getElementById('tb-kw').style.color=m==='kw'?'#fff':'var(--mu)';
  document.getElementById('tb-shop').style.background=m==='shop'?'var(--ol)':'transparent';
  document.getElementById('tb-shop').style.color=m==='shop'?'#fff':'var(--mu)';
}

async function doKeywordScan(){
  var kw=document.getElementById('kw-input').value.trim();
  if(!kw){alert('Please enter a keyword');return;}
  var res=document.getElementById('scan-res');
  res.innerHTML='<div class="card"><div class="loading-row"><div class="spin"></div>Scanning Etsy for "'+kw+'"...</div></div>';
  try{
    var etsyListings=[],etsyTags=[],etsyPrices={};
    try{
      var er=await fetch('/api/etsy?path='+encodeURIComponent('listings/active?keywords='+kw+'&limit=50&sort_on=score'));
      var ed=await er.json();
      etsyListings=ed.results||[];
      var tm={};etsyListings.forEach(function(l){(l.tags||[]).forEach(function(t){tm[t]=(tm[t]||0)+1;});});
      etsyTags=Object.entries(tm).sort(function(a,b){return b[1]-a[1];}).map(function(e){return{tag:e[0],count:e[1]};});
      var pp=etsyListings.map(function(l){return(l.price&&l.price.amount||0)/100;}).filter(function(p){return p>0;}).sort(function(a,b){return a-b;});
      if(pp.length)etsyPrices={min:pp[0].toFixed(2),max:pp[pp.length-1].toFixed(2),avg:(pp.reduce(function(s,p){return s+p;},0)/pp.length).toFixed(2)};
    }catch(e){}
    var ctx=etsyListings.length?etsyListings.length+' listings found. Price range £'+etsyPrices.min+'-£'+etsyPrices.max+' avg £'+etsyPrices.avg+'. Top tags: '+etsyTags.slice(0,10).map(function(t){return t.tag;}).join(', '):'No live Etsy data.';
    var d=await callAI('Scan Etsy keyword "'+kw+'" for UK POD seller. Real data: '+ctx+'. IMPORTANT: Base scores on the REAL listing count and price data — more listings = higher competition score. Return JSON: {"listingCount":'+etsyListings.length+',"competitorCount":"~'+etsyListings.length+' visible","priceRange":"£'+( etsyPrices.min||'?')+'-£'+( etsyPrices.max||'?')+'","avgPrice":"£'+( etsyPrices.avg||'?')+'","demandScore":7,"competitionScore":'+Math.min(10,Math.round(etsyListings.length/5))+',"opportunityScore":7.2,"verdict":"WORTH TESTING","verdictReason":"specific reason based on real data above","topTags":['+JSON.stringify(etsyTags.slice(0,13).map(function(t){return t.tag;}))+'],"priceInsight":"what the real price data tells us","topIdea":{"product":"exact product","ukPrice":"£14.99","margin":"72%","platform":"Printify"},"quickAction":"specific thing to do right now"}');
    var h=tsBar('Keyword scan — "'+kw+'"  · '+etsyListings.length+' listings found');
    var vc={'BUY IN':'var(--gn)','WORTH TESTING':'var(--gd)','PROCEED WITH CAUTION':'var(--or)','AVOID':'var(--rd)'}[d.verdict]||'var(--gd)';
    h+='<div class="card-live fu"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:16px"><div style="flex:1"><div class="serif" style="font-size:28px;font-weight:600;margin-bottom:8px">'+kw+'</div><span style="background:'+vc+'18;color:'+vc+';border:1px solid '+vc+'44;border-radius:20px;padding:5px 16px;font-size:13px;font-weight:700">'+d.verdict+'</span><p style="margin-top:8px;font-size:13px;color:var(--mu);line-height:1.6">'+d.verdictReason+'</p></div><div class="score-ring '+( d.opportunityScore>=7?'score-high':'score-mid')+'">'+d.opportunityScore+'</div></div>';
    h+='<div class="grid-auto">'+sbox('Listings Found',d.listingCount,'var(--mu)')+sbox('Demand',d.demandScore+'/10',d.demandScore>=7?'var(--ol)':'var(--gd)')+sbox('Competition',d.competitionScore+'/10',d.competitionScore<=4?'var(--gn)':'var(--or)')+sbox('Avg Price',d.avgPrice,'var(--gd)')+'</div>';
    if(d.priceInsight)h+='<p style="margin-top:10px;font-size:13px;color:var(--mu);font-style:italic">'+d.priceInsight+'</p></div>';
    if(d.topIdea){h+='<div class="card-gold d1"><div class="lbl" style="color:var(--gd)">Top Idea</div><div style="font-weight:700;font-size:16px;margin-bottom:8px">'+d.topIdea.product+'</div><div class="grid-auto">'+sbox('UK Price',d.topIdea.ukPrice,'var(--gd)')+sbox('Margin',d.topIdea.margin,'var(--ol)')+sbox('Platform',d.topIdea.platform,'var(--bl)')+'</div>';if(d.quickAction)h+='<div style="margin-top:10px;padding:10px;background:var(--w);border-radius:8px;font-size:13px;font-weight:600;color:var(--ol)">→ '+d.quickAction+'</div>';h+='</div>';}
    if(d.topTags&&d.topTags.length){h+='<div class="card d2"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><span class="lbl" style="margin:0">Top Tags Found</span><button class="btn-ghost btn-sm" onclick="navigator.clipboard&&navigator.clipboard.writeText(\''+d.topTags.join(', ')+'\')">Copy All</button></div><div>';d.topTags.forEach(function(t){h+='<span style="display:inline-block;background:var(--p2);border:1px solid var(--b1);border-radius:20px;padding:3px 10px;font-size:11px;font-family:DM Mono,monospace;margin:2px">'+t+'</span>';});h+='</div></div>';}
    h+='<div class="link-row" style="margin-top:12px"><a href="https://www.etsy.com/uk/search?q='+encodeURIComponent(kw)+'" target="_blank" style="font-size:12px;padding:6px 12px;border-radius:7px;border:1.5px solid #f1641e44;color:#f1641e;text-decoration:none;font-weight:600">Etsy UK →</a><a href="https://www.ebay.co.uk/sch/i.html?_nkw='+encodeURIComponent(kw)+'&LH_Sold=1" target="_blank" style="font-size:12px;padding:6px 12px;border-radius:7px;border:1.5px solid #e5323844;color:#e53238;text-decoration:none;font-weight:600">eBay Sold →</a><a href="https://www.pinterest.co.uk/search/pins/?q='+encodeURIComponent(kw)+'" target="_blank" style="font-size:12px;padding:6px 12px;border-radius:7px;border:1.5px solid #e6002344;color:#e60023;text-decoration:none;font-weight:600">Pinterest →</a><button class="btn-olive btn-sm" onclick="window.location.href='search.html?kw='+encodeURIComponent(kw)">Full Research →</button></div>';
    res.innerHTML=h;
  }catch(e){res.innerHTML='<div class="card-red"><strong>Error:</strong> '+e.message+'</div>';}
}

async function doShopScan(){
  var shop=document.getElementById('shop-input').value.trim();
  if(!shop){alert('Please enter a shop name');return;}
  var res=document.getElementById('scan-res');
  res.innerHTML='<div class="card"><div class="loading-row"><div class="spin"></div>Analysing shop "'+shop+'"...</div></div>';
  try{
    var d=await callAI('Analyse Etsy shop "'+shop+'" for a UK POD competitor intelligence report. Return JSON: {"shopName":"'+shop+'","estimatedMonthlyRevenue":"£X,XXX","topProducts":["product1","product2","product3"],"pricingStrategy":"what price range they focus on","designStyle":"their visual style","keyStrengths":["strength1","strength2"],"weaknesses":["weakness1","weakness2"],"topTags":["tag1","tag2","tag3","tag4","tag5"],"gapToExploit":"specific gap you can fill that they miss","shopUrl":"https://www.etsy.com/uk/shop/'+shop+'"}');
    var h=tsBar('Shop analysis — '+shop);
    h+='<div class="card-live fu"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap"><div style="flex:1"><div class="serif" style="font-size:24px;font-weight:600;margin-bottom:8px">'+d.shopName+'</div><a href="'+d.shopUrl+'" target="_blank" style="font-size:12px;color:var(--ol);font-weight:600">View Shop on Etsy →</a></div><div class="sbox" style="text-align:right"><div class="lbl">Est Monthly Revenue</div><div class="mono" style="font-size:20px;color:var(--ol);font-weight:700">'+d.estimatedMonthlyRevenue+'</div></div></div>';
    h+='<div style="margin-top:14px"><div class="lbl">Top Products</div>';(d.topProducts||[]).forEach(function(p){h+=pill(p);});h+='</div>';
    h+='<div class="grid-2" style="margin-top:14px"><div><div class="lbl" style="color:var(--gn)">Strengths</div>';(d.keyStrengths||[]).forEach(function(s){h+='<div style="display:flex;gap:8px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--b1)"><span style="color:var(--gn)">✓</span>'+s+'</div>';});h+='</div><div><div class="lbl" style="color:var(--rd)">Weaknesses</div>';(d.weaknesses||[]).forEach(function(w){h+='<div style="display:flex;gap:8px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--b1)"><span style="color:var(--rd)">✗</span>'+w+'</div>';});h+='</div></div>';
    if(d.gapToExploit)h+='<div style="margin-top:14px;padding:12px;background:var(--olbg);border:1px solid var(--olbr);border-radius:8px"><div class="lbl" style="color:var(--ol)">💡 Gap to Exploit</div><p style="font-size:13px;font-weight:600">'+d.gapToExploit+'</p></div>';
    h+='</div>';
    res.innerHTML=h;
  }catch(e){res.innerHTML='<div class="card-red"><strong>Error:</strong> '+e.message+'</div>';}
}
</script></body></html>
