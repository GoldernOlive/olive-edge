<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Global Arbitrage — Olive Edge</title>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <a href="search.html" class="nav-logo" style="text-decoration:none"><span class="sub">Golden Olive</span><span class="main">Olive <span>Edge</span></span></a>
    <div class="nav-links">
      <a href="search.html" class="nav-link">🔍 Search</a>
      <a href="listing-generator.html" class="nav-link">✍️ Listing Writer</a>
      <a href="listing-auditor.html" class="nav-link">🔎 My Listings</a>
    </div>
    <div class="nav-user">
      <span class="nav-email" id="nav-email"></span>
      <button class="btn-ghost btn-sm" onclick="logout()">Log Out</button>
    </div>
  </div>
</nav>
<div class="page">
  <div class="fu">
    <div class="page-title serif">Global Arbitrage Finder</div>
    <div class="page-sub">What is trending in USA right now but not yet in UK — be the first seller in your market</div>
  </div>
  <div class="card fu" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
    <div style="flex:1"><div class="lbl">Your niche or product category</div><input id="arb-kw" placeholder="e.g. mugs, wall art, tote bags, candles, jewellery..." onkeydown="if(event.key==='Enter')doArbitrage()"/></div>
    <button class="btn-olive" onclick="doArbitrage()">Find Arbitrage Opportunities</button>
    <button class="btn-ghost" onclick="doFullScan()">Scan All POD Niches</button>
  </div>
  <div id="arb-ts"></div>
  <div id="arb-result"></div>
</div>
<script>

var SB_URL='https://oktpizrevqehfrkcqphq.supabase.co';
var SB_KEY='sb_publishable_r4lLwwInTT76wXjP-Cha4Q_T1yALqyt';
function getSession(){return{token:localStorage.getItem('oe_token')||'',email:localStorage.getItem('oe_email')||'',userId:localStorage.getItem('oe_uid')||''};}
function logout(){localStorage.removeItem('oe_token');localStorage.removeItem('oe_email');localStorage.removeItem('oe_uid');window.location.href='index.html';}
var SESSION=getSession();
if(!SESSION.token){window.location.href='index.html';}
else{var em=document.getElementById('nav-email');if(em)em.textContent=SESSION.email;}
function nowTs(){return new Date().toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function tsBar(label){return '<div style="display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;font-size:11px;color:var(--mu);background:var(--p2);padding:5px 12px;border-radius:20px;border:1px solid var(--b1)"><span style="width:7px;height:7px;border-radius:50%;background:var(--gn);display:inline-block"></span>'+label+' · Live · '+nowTs()+'</div>';}

function sbox(l,v,c){return '<div class="sbox"><div class="lbl">'+l+'</div><div class="mono" style="font-size:15px;color:'+(c||'var(--tx)')+';font-weight:700">'+(v||'—')+'</div></div>';}
async function callAI(prompt){var r=await fetch('/api/groq',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:prompt})});var text=await r.text();var d;try{d=JSON.parse(text);}catch(pe){throw new Error('Parse error');}if(!r.ok)throw new Error(d.error&&d.error.message||'AI error');return d;}
async function getTrendsData(){try{var r=await fetch('/api/trends');return r.json();}catch(e){return{};}}

async function doArbitrage(){
  var kw=document.getElementById('arb-kw').value.trim()||'print on demand';
  var res=document.getElementById('arb-result');
  document.getElementById('arb-ts').innerHTML=tsBar('Global arbitrage scan — "'+kw+'"');
  res.innerHTML='<div class="card"><div class="loading-row"><div class="spin"></div>Fetching real Google Trends for UK, USA, Germany, Australia simultaneously...</div></div>';
  var trendsData=await getTrendsData();
  var gbT=(trendsData.trendingByMarket&&trendsData.trendingByMarket.GB||[]).map(function(t){return t.term;});
  var usT=(trendsData.trendingByMarket&&trendsData.trendingByMarket.US||[]).map(function(t){return t.term;});
  var deT=(trendsData.trendingByMarket&&trendsData.trendingByMarket.DE||[]).map(function(t){return t.term;});
  var auT=(trendsData.trendingByMarket&&trendsData.trendingByMarket.AU||[]).map(function(t){return t.term;});
  try{
    var d=await callAI('Global Etsy arbitrage for "'+kw+'". Real trends: UK:'+gbT.slice(0,8).join(',')+' USA:'+usT.slice(0,8).join(',')+' DE:'+deT.slice(0,8).join(',')+' AU:'+auT.slice(0,8).join(',')+'\n\nFind products selling in USA but not yet in UK. Return JSON: {"summary":"key insight","usaToUK":[{"product":"exact product","usaTrend":"why trending USA","ukOpportunity":"why UK is wide open","suggestedPrice":"£X","urgency":"X weeks","designAngle":"what to design","estimatedRevenue":"£X-£Y/month"},{"product":"product2","usaTrend":"trend","ukOpportunity":"opportunity","suggestedPrice":"£X","urgency":"weeks","designAngle":"angle","estimatedRevenue":"revenue"},{"product":"product3","usaTrend":"trend","ukOpportunity":"opportunity","suggestedPrice":"£X","urgency":"weeks","designAngle":"angle","estimatedRevenue":"revenue"}],"culturalGaps":[{"gap":"cultural difference","opportunity":"exact opportunity","markets":"UK vs USA","designIdea":"specific idea"}]}');
    var html='<div class="card-live fu"><div class="lbl" style="color:var(--ol)">Global Arbitrage Intelligence</div><p style="font-size:14px;line-height:1.7">'+d.summary+'</p>';
    if(gbT.length||usT.length){html+='<div style="margin-top:12px;padding:10px;background:var(--p2);border-radius:8px"><div class="lbl">Real Trend Data Analysed</div><div class="grid-2"><div><div style="font-size:11px;font-weight:700;color:var(--mu);margin-bottom:4px">🇬🇧 UK TRENDING</div>'+gbT.slice(0,5).map(function(t){return '<span class="pill" style="font-size:10px">'+t+'</span>';}).join('')+'</div><div><div style="font-size:11px;font-weight:700;color:var(--mu);margin-bottom:4px">🇺🇸 USA TRENDING</div>'+usT.slice(0,5).map(function(t){return '<span class="pill" style="font-size:10px">'+t+'</span>';}).join('')+'</div></div></div>';}
    html+='</div><div class="card d1"><div class="lbl" style="color:var(--rd)">🇺🇸 → 🇬🇧 USA Trending, UK Wide Open</div><p style="font-size:12px;color:var(--mu);margin-bottom:14px">These are selling strongly in the USA — UK sellers haven't caught up yet.</p>';
    (d.usaToUK||[]).forEach(function(p){
      html+='<div class="card2" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px"><div style="flex:1"><div style="font-weight:700;font-size:16px;margin-bottom:5px">'+p.product+'</div><div style="font-size:12px;color:var(--mu);margin-bottom:3px"><strong>USA:</strong> '+p.usaTrend+'</div><div style="font-size:12px;color:var(--ol);font-weight:600"><strong>UK gap:</strong> '+p.ukOpportunity+'</div></div><div style="text-align:right;flex-shrink:0"><div style="font-weight:700;color:var(--gd);font-family:DM Mono,monospace;font-size:18px">'+p.suggestedPrice+'</div><div style="font-size:10px;color:var(--rd);font-weight:700">'+p.urgency+'</div></div></div><div style="font-size:12px;padding:8px;background:var(--gdbg);border-radius:6px;margin-bottom:8px"><strong>Design:</strong> '+p.designAngle+' · <strong>Est revenue:</strong> <span style="color:var(--gd);font-weight:700">'+p.estimatedRevenue+'</span></div><div style="display:flex;gap:6px"><a href="https://www.etsy.com/uk/search?q='+encodeURIComponent(p.product)+'" target="_blank" style="font-size:11px;padding:3px 9px;border:1px solid var(--olbr);border-radius:5px;color:var(--ol);text-decoration:none;font-weight:600">Etsy UK →</a><a href="https://www.etsy.com/search?q='+encodeURIComponent(p.product)+'" target="_blank" style="font-size:11px;padding:3px 9px;border:1px solid var(--b1);border-radius:5px;color:var(--tx);text-decoration:none;font-weight:600">Etsy USA →</a><button class="btn-olive btn-sm" onclick="window.location.href='search.html?kw='+encodeURIComponent(p.product)">Full Research →</button></div></div>';
    });
    html+='</div>';
    var cg=d.culturalGaps||[];
    if(cg.length){html+='<div class="card-gold d2"><div class="lbl" style="color:var(--gd)">Cultural Gaps</div>';cg.forEach(function(c){html+='<div style="padding:12px 0;border-bottom:1px solid var(--gdbr)"><div style="font-weight:700;font-size:14px;margin-bottom:5px">'+c.gap+'</div><div style="font-size:12px;color:var(--mu);margin-bottom:3px">'+c.opportunity+'</div><div style="font-size:12px;color:var(--ol)">Design idea: '+c.designIdea+'</div><span style="font-size:10px;color:var(--mu)">'+c.markets+'</span></div>';});html+='</div>';}
    res.innerHTML=html;
  }catch(e){res.innerHTML='<div class="card-red"><strong>Error:</strong> '+e.message+'</div>';}
}
function doFullScan(){document.getElementById('arb-kw').value='print on demand gifts home decor mugs tote bags wall art';doArbitrage();}
</script></body></html>
